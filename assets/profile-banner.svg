<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Ashutosh banner</title>
  <desc id="desc">Dark futuristic banner with a greeting and Ashutosh name, plus a terminal icon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#070b11"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>
    <linearGradient id="textGlow" x1="0" x2="1">
      <stop offset="0%" stop-color="#f4f8fb"/>
      <stop offset="100%" stop-color="#dadfe7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="lineGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#fcfcfd" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>

  <g stroke="#d9dfe5" stroke-opacity="0.35" stroke-width="1.2" fill="none" filter="url(#lineGlow)">
    <g opacity="0.9">
