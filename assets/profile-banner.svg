      <circle cx="352" cy="84" r="8" fill="#ffbd2e"/>
      <circle cx="376" cy="84" r="8" fill="#28c840"/>
    </g>

    <path d="M100 140 L130 140 L130 170 L164 170 L164 204 L130 204 L130 234 L100 234 L100 204 L66 204 L66 170 L100 170 Z" fill="#0d1218" opacity="0.15"/>
    <path d="M70 250 L220 250" stroke="#f5f6f8" stroke-width="20" stroke-linecap="round"/>
    <path d="M168 262 L140 200 L126 220 L155 282 Z" fill="#f5f6f8"/>
