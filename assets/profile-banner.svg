      <path d="M0 200 L100 260 L220 180 L360 250 L460 180 L560 260 L660 210 L770 280 L900 210 L1030 310 L1160 220 L1260 280 L1370 210 L1600 270"/>
      <path d="M0 360 L170 300 L260 420 L420 310 L560 390 L700 290 L880 420 L1010 300 L1120 430 L1240 330 L1400 410 L1600 340"/>
      <path d="M0 110 L120 20 L200 120 L320 40 L460 170 L610 50 L760 170 L930 60 L1040 180 L1200 70 L1380 180 L1600 20"/>
      <path d="M0 450 L170 370 L260 470 L350 350 L520 460 L670 330 L820 430 L960 350 L1090 470 L1240 390 L1400 480 L1600 430"/>
    </g>
    <g opacity="0.95">
      <path d="M0 30 L180 220 L360 90 L500 240 L720 120 L880 260 L1090 130 L1240 310 L1600 100"/>
      <path d="M80 490 L220 330 L410 440 L580 300 L730 500 L920 320 L1120 470 L1280 330 L1600 500"/>
    </g>
  </g>

  <g fill="#f4f6f8" opacity="0.9">
    <circle cx="60" cy="105" r="3.2"/>
    <circle cx="175" cy="85" r="3.2"/>
    <circle cx="260" cy="178" r="3.2"/>
    <circle cx="440" cy="160" r="3.2"/>
    <circle cx="540" cy="90" r="3.2"/>
    <circle cx="760" cy="50" r="3.2"/>
    <circle cx="980" cy="80" r="3.2"/>
    <circle cx="1160" cy="60" r="3.2"/>
    <circle cx="1360" cy="100" r="3.2"/>
    <circle cx="330" cy="60" r="3.2"/>
    <circle cx="930" cy="60" r="3.2"/>
    <circle cx="1240" cy="70" r="3.2"/>
    <circle cx="260" cy="420" r="3.2"/>
    <circle cx="560" cy="390" r="3.2"/>
    <circle cx="1010" cy="300" r="3.2"/>
    <circle cx="1400" cy="410" r="3.2"/>
    <circle cx="220" cy="330" r="3.2"/>
    <circle cx="580" cy="300" r="3.2"/>
    <circle cx="1090" cy="470" r="3.2"/>
    <circle cx="1280" cy="330" r="3.2"/>
    <circle cx="380" cy="260" r="3.2"/>
    <circle cx="680" cy="210" r="3.2"/>
    <circle cx="900" cy="210" r="3.2"/>
    <circle cx="1200" cy="220" r="3.2"/>
  </g>

  <g transform="translate(110 90)">
    <text x="0" y="0" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="54" font-weight="700">👋</text>
    <text x="70" y="82" fill="url(#textGlow)" font-family="'Segoe UI', 'Tahoma', sans-serif" font-size="54" font-weight="400" letter-spacing="1">Hey!</text>
    <text x="265" y="82" fill="url(#textGlow)" font-family="'Segoe UI', 'Tahoma', sans-serif" font-size="54" font-weight="400" letter-spacing="1">I am ...</text>
    <text x="0" y="230" fill="#f5f8ff" font-family="'Courier New', 'Lucida Console', monospace" font-size="190" font-weight="700" letter-spacing="1.2" style="text-shadow: 0 0 18px rgba(255,255,255,0.18);">Ashutosh</text>
  </g>

  <g transform="translate(1180 130)" filter="url(#softShadow)">
    <path d="M30 0 L300 0 Q350 0 350 50 L350 330 Q350 380 300 380 L30 380 Q-20 380 -20 330 L-20 50 Q-20 0 30 0 Z" fill="#3a3d41"/>
    <path d="M60 32 L290 32 Q314 32 314 56 L314 295 Q314 319 290 319 L60 319 Q36 319 36 295 L36 56 Q36 32 60 32 Z" fill="#2d3035"/>
    <g fill="#f3f4f6">
